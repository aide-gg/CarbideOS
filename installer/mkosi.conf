[Config]
MinimumVersion=25.3

[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64
RepositoryKeyCheck=yes

# esp produces a bootable ESP-only disk image to write to a USB stick, and
# SplitArtifacts emits the bare UKI alongside it for firmware that is pointed
# at an EFI binary directly. The whole installer, payload included, lives in
# that single signed PE file.
[Output]
Format=esp
Output=carbideos-installer
OutputDirectory=../mkosi.output
ImageId=carbideos-installer
SplitArtifacts=uki
# UEFI reads the ESP out of an El Torito entry using its FAT driver, which
# wants 512-byte logical sectors. systemd-repart picks 4096 for an image this
# size, and firmware then fails to find anything bootable on the disc at all.
SectorSize=512
# Leave compression on. mkosi uses this setting for the initrd inside the UKI
# as well as for the output artifacts, so turning it off inflated the .initrd
# PE section from roughly 460 MB to 615 MB.
CompressOutput=zstd
CompressLevel=15

[Content]
Bootable=yes
# No boot loader. There is one entry, no A/B slots to choose between, and no
# boot counting to arbitrate, so systemd-boot would only put a menu in front
# of the single thing this can do. The UKI is installed as the removable
# media path instead, which firmware boots directly off a USB stick.
Bootloader=uki
UnifiedKernelImages=yes
Hostname=carbideos-installer
Locale=C.UTF-8
Timezone=UTC
WithDocs=no
WithRecommends=no
CleanPackageMetadata=yes
# The image is an initrd that never switches root, so there is no SELinux
# policy to label against and nothing persistent to label.
SELinuxRelabel=no
Packages=
        basesystem
        dbus-broker
        fontconfig
        jetbrains-mono-fonts
        # kernel-core only, matching the base image. The long tail in
        # kernel-modules is weight the installer never loads, and whatever
        # boots CarbideOS on a machine will boot the installer on it too.
        kernel-core
        libinput
        libxkbcommon
        systemd
        # Present for linuxx64.efi.stub alone. A UKI is kernel, initrd and
        # command line wrapped by that stub into one PE binary, so it is
        # needed even though Bootloader=uki installs no boot loader.
        systemd-boot-unsigned
        systemd-udev
        util-linux
KernelCommandLine=
        systemd.unit=carbide-installer.target
        # Otherwise firstboot stops on the console to ask for a root password
        # before the installer can start.
        systemd.firstboot=no
        loglevel=0
        quiet
        rd.udev.log_level=err
        udev.log_level=err
        vt.global_cursor_default=0
        init_on_alloc=1
        init_on_free=1
        page_alloc.shuffle=1
        randomize_kstack_offset=on

[Validation]
SecureBoot=yes
SecureBootAutoEnroll=no
Checksum=no
Sign=no

[Build]
ToolsTree=default
# Deliberately not the base image's caches. These are two different images,
# and a build interrupted here must not be able to leave torn metadata behind
# for the production image build to trip over.
CacheDirectory=../mkosi.cache/installer
PackageCacheDirectory=../mkosi.pkgcache/installer
History=yes

[Runtime]
Firmware=uefi
Console=gui
RAM=4G
CPUs=4
