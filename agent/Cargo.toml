[package]
name = "carbide-agent"
version = "0.1.2"
edition = "2024"
description = "CarbideOS system extension supervisor and recovery component"
license = "AGPL-3.0-or-later"

# Dependencies are deliberately minimal. This binary ships in the sealed base
# image and is the last thing standing when an extension breaks, so every crate
# added here is a supply-chain input to the recovery path itself.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
