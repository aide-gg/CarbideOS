[Unit]
Description=CarbideOS Emergency Login
Conflicts=getty@tty1.service

[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --noclear - linux
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
TTYVTDisallocate=no
