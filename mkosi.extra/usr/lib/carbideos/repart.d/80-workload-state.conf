# Deliberately uses a private GPT type so it is not mistaken for system state.
#
# Job scratch and browser profiles are elastic and wiped per job, so workload
# yields growth priority to state, which stores the extension images the node
# needs in order to recover itself.
[Partition]
Type=7f4f26d4-9d15-4e21-8e52-8bb8e11c23f8
Label=carbideos_workload
Format=btrfs
Encrypt=tpm2
SizeMinBytes=256M
Weight=2
