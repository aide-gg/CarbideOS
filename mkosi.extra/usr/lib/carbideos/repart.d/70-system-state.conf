# A private GPT type avoids coupling /var discovery to a persistent machine-id,
# which is provisioned in a later phase. The TPM2 key is unique to this volume.
#
# This partition backs /var/lib/extensions, so it stores the signed extension
# images themselves. Retaining an active image alongside its known-good
# predecessor is what makes extension rollback possible, so state gets a hard
# floor and the largest growth weight rather than competing for leftovers.
# Budget at the floor:
#   watchtower  192M active + 192M known-good + 192M candidate = 576M
#   chrome      512M active + 512M known-good                  = 1024M
#   journals, homed admin subvolume, sealed credentials        = ~400M
# A node that cannot hold both images cannot satisfy the rollback guarantee,
# so provisioning must fail loudly here instead of booting un-recoverable.
[Partition]
Type=2c8c5536-9ef2-4f91-8342-237d0f4d810a
Label=carbideos_state
Format=btrfs
Encrypt=tpm2
SizeMinBytes=2G
Weight=3
GrowFileSystem=yes
