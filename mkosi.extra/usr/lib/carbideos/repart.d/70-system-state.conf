# A private GPT type avoids coupling /var discovery to a persistent machine-id,
# which is provisioned in a later phase. The TPM2 key is unique to this volume.
[Partition]
Type=2c8c5536-9ef2-4f91-8342-237d0f4d810a
Label=carbideos_state
Format=btrfs
Encrypt=tpm2
SizeMinBytes=256M
Weight=1
GrowFileSystem=yes
