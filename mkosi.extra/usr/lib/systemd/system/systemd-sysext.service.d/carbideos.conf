[Unit]
RequiresMountsFor=/var/lib/extensions

[Service]
ExecStart=
ExecStart=systemd-sysext --image-policy=root=verity+signed+absent:usr=verity+signed+absent refresh
ExecStartPost=-/usr/bin/systemctl --no-block start watchtower.service
ExecReload=
ExecReload=systemd-sysext --image-policy=root=verity+signed+absent:usr=verity+signed+absent refresh
